<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="description" content="Auditor Veritas - Immutable, GDPR-compliant audit logs for enterprise.">
    <meta name="theme-color" content="#1e40af">
    
    <title>Auditor Veritas - GDPR Compliant Audit Trail</title>
    
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      .loading-spinner {
        display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-size: 1.2rem;
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 3px solid white;
        width: 40px; height: 40px; animation: spin 1s linear infinite; margin-right: 15px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    
    <form name="enterprise-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <input type="text" name="industry" />
      <input type="text" name="timeline" />
      <input type="text" name="volume" />
      <input type="text" name="region" />
      <input type="text" name="retention" />
      <input type="text" name="compliance" />
    </form>

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <form name="contact_footer" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <span>Loading Auditor Veritas...</span>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Tar bort laddningsindikatorn när appen har laddats
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loading = document.getElementById('loading');
          if (loading) loading.style.display = 'none';
        }, 500);
      });
    </script>
  </body>
</html>
