[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# 🔥 KORREKT REDIRECT - ANVÄND RÄTT URL MED /api
[[redirects]]
  from = "/api/*"
  to = "https://auditor-veritas-mvp.omender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200