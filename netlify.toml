[build]
  # Fixar Permission denied felet genom att använda npx för att köra vite
  command = "npm install --prefix frontend && npx vite build --prefix frontend"
  publish = "frontend/dist"
  base = "frontend"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://auditor-veritas-mvp.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # BORTTAGET: payment=() tas bort, då Stripe-beroendet eliminerats
    # BORTTAGET: Alla Stripe URL:er är borttagna från CSP
    Content-Security-Policy = "default-src 'self'; 
      script-src 'self' 'unsafe-inline'; 
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
      font-src 'self' https://fonts.gstatic.com; 
      img-src 'self' data: https:; 
      frame-src 'self'; 
      connect-src 'self' https://auditor-veritas-mvp.onrender.com https://ridpgvikvjreljwypbpj.supabase.co wss://ridpgvikvjreljwypbpj.supabase.co;"

    Permissions-Policy = "camera=(), microphone=(), geolocation=()"