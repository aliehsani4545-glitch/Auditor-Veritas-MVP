[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# 1. FIXAD Redirect API calls till Render backend (Tar bort /api/ från to-URL:en)
[[redirects]]
  from = "/api/*"
  to = "https://auditor-veritas-mvp.onrender.com/:splat" 
  status = 200
  force = true

# 2. FIXAD EXTRA REDIRECT FÖR DIRECT ANROP (Tar bort /api/ från to-URL:en)
[[redirects]]
  from = "/create-processor"
  to = "https://auditor-veritas-mvp.onrender.com/create-processor" # Får Render-servern att hantera anropet på rotnivå
  status = 200
  force = true

# 3. SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200