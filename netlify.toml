[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://auditor-veritas-mvp.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    
    # UPPDATERAD CSP:
    # 1. Tillagd Supabase URL (https + wss) i connect-src
    # 2. Tillagd Stripe i script-src, frame-src och connect-src (för att undvika framtida fel)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; connect-src 'self' https://auditor-veritas-mvp.onrender.com https://ridpgvikvjreljwypbpj.supabase.co wss://ridpgvikvjreljwypbpj.supabase.co https://api.stripe.com https://checkout.stripe.com;"