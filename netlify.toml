[build]
  # Detta säger åt Netlify att allt händer i "frontend"-mappen
  base = "frontend"
  
  # Eftersom vi redan är i "frontend"-mappen (pga base ovan), 
  # kör vi bara standardkommandon utan --prefix.
  # npx vite build löser "Permission denied"-felet.
  command = "npm install && npx vite build"
  
  # Mappen där Vite lägger byggfilerna (relativt till base)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Omdirigeringar för API-anrop till din Render-backend
[[redirects]]
  from = "/api/*"
  to = "https://auditor-veritas-mvp.onrender.com/api/:splat"
  status = 200
  force = true

# SPA-support (Single Page Application) för React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # CSP: Helt rensad från Stripe. Använder trippelcitat för att tillåta radbrytningar.
    Content-Security-Policy = """default-src 'self'; 
      script-src 'self' 'unsafe-inline'; 
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
      font-src 'self' https://fonts.gstatic.com; 
      img-src 'self' data: https:; 
      frame-src 'self'; 
      connect-src 'self' https://auditor-veritas-mvp.onrender.com https://ridpgvikvjreljwypbpj.supabase.co wss://ridpgvikvjreljwypbpj.supabase.co;"""