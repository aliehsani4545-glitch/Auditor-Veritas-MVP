[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Redirect API calls to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://auditor-veritas-mvp.onrender.com/api/:splat"
  status = 200
  force = true

# 🔥 EXTRA REDIRECT FÖR DIRECT ANROP
[[redirects]]
  from = "/create-processor"
  to = "https://auditor-veritas-mvp.onrender.com/api/create-processor"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200